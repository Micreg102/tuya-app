version: '3.8'

services:
  mongodb:
    image: mongo:6.0 # Sprawdzona, stabilna wersja
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # To sprawi, że dane przetrwają restarty Maca
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai # Zmień na nazwę folderu z Pythonem
    container_name: python-ai
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend # Zmień na nazwę folderu z Javą
    container_name: java-backend
    ports:
      - "8080:8080"
    environment:
      # Nadpisujemy bazę z 'tuya' (z Dockerfile) na 'tuya_iot', w której masz prawdziwe dane
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/tuya_iot
    depends_on:
      - mongodb
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend # Zmień na nazwę folderu z Reactem
    container_name: react-frontend
    ports:
      - "3000:80" # Mac Studio wystawi to na porcie 3000, Nginx w środku słucha na 80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: